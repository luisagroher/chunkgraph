name: chunkgraph
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # Data pipeline
  - requests
  - beautifulsoup4
  - lxml
  - pandas
  - python-dotenv
  # Graph
  - networkx
  # Notebook
  - jupyter
  - ipykernel
  - pip:
    # Retrieval / embeddings
    - scikit-learn
    - sentence-transformers
    - datasets # hugginface
    - transformers
    - accelerate
    - evaluate
    - torch --index-url https://download.pytorch.org/whl/cpu
    - faiss-cpu
    # Visualization
    - pyvis
    # Code quality
    - black
    - ruff
